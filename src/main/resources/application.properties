spring.application.name=hawk
server.port=8080

# MongoDB (Spring Boot 4 usa spring.mongodb.*)
spring.mongodb.uri=${MONGODB_URI:mongodb+srv://hawk_secret_user:Hawk3000@cluster0.4dh4jnp.mongodb.net/hawk?retryWrites=true&w=majority}
spring.data.mongodb.auto-index-creation=false
spring.data.mongodb.representation.big-decimal=decimal128

# JWT — a chave secreta é carregada/persistida na collection admin (jwt_keys)
hawk.jwt.issuer=hawk-api
hawk.jwt.access-token-expiration-seconds=3600
hawk.jwt.refresh-token-expiration-seconds=604800

# Seed de usuários de demonstração na subida (desative em produção)
hawk.seed.enabled=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.org.springframework.security=INFO
