spring.application.name=hawk
# Render injeta PORT; localmente cai em 8080
server.port=${PORT:8080}

# MongoDB — preferir MONGODB_URI no ambiente (Render / local)
spring.mongodb.uri=${MONGODB_URI:mongodb+srv://hawk_secret_user:Hawk3000@cluster0.4dh4jnp.mongodb.net/hawk?retryWrites=true&w=majority}
spring.data.mongodb.auto-index-creation=false
spring.data.mongodb.representation.big-decimal=decimal128

# JWT — a chave secreta é carregada/persistida na collection admin (jwt_keys)
hawk.jwt.issuer=${HAWK_JWT_ISSUER:hawk-api}
hawk.jwt.access-token-expiration-seconds=${HAWK_JWT_ACCESS_SECONDS:3600}
hawk.jwt.refresh-token-expiration-seconds=${HAWK_JWT_REFRESH_SECONDS:604800}

# Seed de usuários de demonstração na subida
hawk.seed.enabled=${HAWK_SEED_ENABLED:true}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.org.springframework.security=INFO
